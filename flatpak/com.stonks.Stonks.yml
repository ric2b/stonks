app-id: com.stonks.Stonks
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: stonks
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  # python3-deps.json is committed and regenerated when dependencies change.
  # PySide6/shiboken/numpy provided by BaseApp; curl-cffi excluded (yfinance falls back to requests).
  # To regenerate: see flatpak/README.md or run:
  #   uv export --no-dev --no-hashes --no-emit-project -o /tmp/reqs.txt
  #   grep -v -i -E 'pyside|shiboken|numpy|curl.cffi' /tmp/reqs.txt > /tmp/reqs-filtered.txt
  #   python -m flatpak_pip_generator --requirements-file /tmp/reqs-filtered.txt --output flatpak/python3-deps
  #   Then manually add pandas (binary wheel) and pyqtgraph entries to the JSON.
  - python3-deps.json

  - name: stonks
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps .
      - install -Dm644 flatpak/com.stonks.Stonks.desktop /app/share/applications/com.stonks.Stonks.desktop
      - install -Dm644 flatpak/com.stonks.Stonks.metainfo.xml /app/share/metainfo/com.stonks.Stonks.metainfo.xml
      - install -Dm644 assets/com.stonks.Stonks.svg /app/share/icons/hicolor/scalable/apps/com.stonks.Stonks.svg
    sources:
      - type: dir
        path: ..
