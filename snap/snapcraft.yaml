name: stonks
base: core24
version: '0.1.0'
summary: Desktop stock tracker for Linux
description: |
  A desktop stock tracker application for monitoring
  your investments. Built with PySide6 and pyqtgraph.
grade: stable
confinement: strict
license: GPL-3.0-only
icon: assets/com.stonks.Stonks.svg

platforms:
  amd64:

apps:
  stonks:
    command: bin/stonks
    desktop: snap/gui/stonks.desktop
    plugs:
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl
      - network

parts:
  stonks:
    plugin: python
    source: .
    stage-packages:
      - libegl1
      - libgl1
      - libglib2.0-0t64
      - libfontconfig1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libdbus-1-3
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-keysyms1
      - libxcb-shape0
      - libxcb-xinerama0
      - libxcb-xkb1
