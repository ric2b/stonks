name: Release artifacts

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS app
        working-directory: go
        run: wails build -platform darwin/universal

      - name: Create DMG
        run: |
          hdiutil create -volname Stonks -srcfolder go/build/bin/Stonks.app \
            -ov -format UDZO dist/stonks-macos.dmg
        env:
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/stonks-macos.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux binary
        working-directory: go
        run: wails build -platform linux/amd64

      - name: Create AppDir
        run: |
          mkdir -p Stonks.AppDir/usr/bin
          mkdir -p Stonks.AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p Stonks.AppDir/usr/share/applications

          cp go/build/bin/stonks Stonks.AppDir/usr/bin/Stonks

          if [ -f assets/com.stonks.Stonks.svg ]; then
            sudo apt-get install -y librsvg2-bin
            rsvg-convert -w 256 -h 256 assets/com.stonks.Stonks.svg \
              > Stonks.AppDir/com.stonks.Stonks.png
            cp Stonks.AppDir/com.stonks.Stonks.png \
              Stonks.AppDir/usr/share/icons/hicolor/256x256/apps/
          fi

          cat > Stonks.AppDir/com.stonks.Stonks.desktop <<'EOF'
          [Desktop Entry]
          Name=Stonks
          Exec=Stonks
          Icon=com.stonks.Stonks
          Type=Application
          Categories=Finance;
          EOF
          sed -i 's/^          //' Stonks.AppDir/com.stonks.Stonks.desktop
          cp Stonks.AppDir/com.stonks.Stonks.desktop \
            Stonks.AppDir/usr/share/applications/

          cat > Stonks.AppDir/AppRun <<'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "$HERE/usr/bin/Stonks" "$@"
          APPRUN
          sed -i 's/^          //' Stonks.AppDir/AppRun
          chmod +x Stonks.AppDir/AppRun

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p dist
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream \
            Stonks.AppDir dist/stonks-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/stonks-x86_64.AppImage

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
