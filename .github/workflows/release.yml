name: Release artifacts

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        run: uv sync --no-dev
      - name: Generate .icns
        run: |
          brew install librsvg
          mkdir Stonks.iconset
          for size in 16 32 128 256 512; do
            rsvg-convert -w $size -h $size assets/com.stonks.Stonks.svg > Stonks.iconset/icon_${size}x${size}.png
            rsvg-convert -w $((size*2)) -h $((size*2)) assets/com.stonks.Stonks.svg > Stonks.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns Stonks.iconset -o stonks.icns

      - name: Build .app
        run: |
          uv pip install pyinstaller
          uv run pyinstaller --windowed --name Stonks --icon stonks.icns \
            --collect-all pyqtgraph src/stonks/main.py

      - name: Set bundle version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PLIST=dist/Stonks.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$PLIST"

      - name: Create DMG
        run: |
          hdiutil create -volname Stonks -srcfolder dist/Stonks.app \
            -ov -format UDZO dist/stonks-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/stonks-macos.dmg

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 librsvg2-bin libfuse2t64

      - name: Install Python dependencies
        run: uv sync --no-dev

      - name: Build with PyInstaller
        run: |
          uv pip install pyinstaller
          uv run pyinstaller --name Stonks --collect-all pyqtgraph src/stonks/main.py

      - name: Create AppDir
        run: |
          mkdir -p Stonks.AppDir/usr/bin
          mkdir -p Stonks.AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p Stonks.AppDir/usr/share/applications

          cp -r dist/Stonks/* Stonks.AppDir/usr/bin/

          rsvg-convert -w 256 -h 256 assets/com.stonks.Stonks.svg \
            > Stonks.AppDir/com.stonks.Stonks.png
          cp Stonks.AppDir/com.stonks.Stonks.png \
            Stonks.AppDir/usr/share/icons/hicolor/256x256/apps/

          cat > Stonks.AppDir/com.stonks.Stonks.desktop <<'EOF'
          [Desktop Entry]
          Name=Stonks
          Exec=Stonks
          Icon=com.stonks.Stonks
          Type=Application
          Categories=Finance;
          EOF
          sed -i 's/^          //' Stonks.AppDir/com.stonks.Stonks.desktop
          cp Stonks.AppDir/com.stonks.Stonks.desktop \
            Stonks.AppDir/usr/share/applications/

          cat > Stonks.AppDir/AppRun <<'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "$HERE/usr/bin/Stonks" "$@"
          APPRUN
          sed -i 's/^          //' Stonks.AppDir/AppRun
          chmod +x Stonks.AppDir/AppRun

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream \
            Stonks.AppDir dist/stonks-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/stonks-x86_64.AppImage

  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-snap
          path: ${{ steps.build.outputs.snap }}

  release:
    needs: [macos, appimage, snap]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*

